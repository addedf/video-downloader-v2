build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    active: false

style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  UnusedPrivateMember:
    active: true
  WildcardImport:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
